services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: poopmap
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/poopmap
      # /!\ Required — no default admin account exists. Set real values before starting.
      ADMIN_USERNAME: change-me-admin
      ADMIN_PASSWORD: change-me-please-a-strong-password
      OVERPASS_URL: https://overpass-api.de/api/interpreter
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
