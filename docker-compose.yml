# The database is NOT part of this compose file: in production (Dokploy) Postgres
# runs as its own managed service, and locally the dev flow targets a native
# Postgres on localhost:5432 (see .env). This file only defines the app itself.
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Point at the external Postgres service (Dokploy internal hostname or similar).
      DATABASE_URL: postgresql://postgres:postgres@your-db-host:5432/poopmap
      # /!\ Required — no default admin account exists. Set real values before starting.
      ADMIN_USERNAME: change-me-admin
      ADMIN_PASSWORD: change-me-please-a-strong-password
      OVERPASS_URL: https://overpass-api.de/api/interpreter
